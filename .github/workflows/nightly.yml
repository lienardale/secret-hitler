name: Nightly

# Heavier runs of the rules-engine checks: property tests at 20,000 games each
# and a 20,000-game simulation. Not a required check.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-deep:
    name: engine (20k property runs)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund --prefer-offline
      - run: npm -w @sh/engine run test
        env:
          FC_RUNS: "20000"
      - run: npm -w @sh/engine run simulate -- --games 20000 --seed ${{ github.run_number }}
