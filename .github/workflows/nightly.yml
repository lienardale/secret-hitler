name: Nightly

# Heavier runs of the rules-engine checks: property tests at 20,000 games each
# and a 20,000-game simulation. Not a required check.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-deep:
    name: engine (20k property runs)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund --prefer-offline
      - run: npm -w @sh/engine run test
        env:
          FC_RUNS: "20000"
      - run: npm -w @sh/engine run simulate -- --games 20000 --seed ${{ github.run_number }}
      # Every view and event of 2,000 random games against the strict wire schemas.
      - run: npm -w @sh/protocol run test
        env:
          FC_RUNS: "20000"
